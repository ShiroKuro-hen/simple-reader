  <h1 id="ch1">一</h1>
  <p>吾輩は猫である。名前はまだ無い。</p>
  <p>どこで生れたかとんと見当がつかぬ。何でも薄暗いじめじめした所で<em>ニャーニャー</em>泣いていた事だけは記憶している。</p>
  <p>吾輩はここで始めて<a href="notes.xhtml#n1" epub:type="noteref">人間</a>というものを見た。しかもあとで聞くとそれは書生という<a href="https://example.org/?a=1&amp;b=2" class="ext" title="書生">人間中で一番獰悪な種族</a>であったそうだ。</p>
  <p>既に <ruby>漢字<rt>かんじ</rt></ruby> に読みがある語は二重にしない。Hello, world &amp; 1 &lt; 2 の「猫」だ。</p>
  <p>Only latin and ひらがなとカタカナ here, no kanji at all.</p>
