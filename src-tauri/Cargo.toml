[package]
name = "simple-reader"
version = "0.9.0"
description = "A clean, local-first EPUB and PDF reader."
edition = "2021"
license = "MIT"

[lib]
name = "simple_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Opens the release page in the system browser (the webview ignores links that ask for a new window).
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# Updates the desktop app from the signed installer attached to the newest GitHub release.
tauri-plugin-updater = "2"
