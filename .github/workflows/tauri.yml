name: Tauri (Windows + Android)

on:
  workflow_dispatch:
  push:
    branches: [tauri]
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The installer is signed with the updater key: the installed app only accepts an update signed by it.
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Release profile and after the build, so the dependencies and ../dist it already made are reused.
      - run: cargo test --release --lib --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: simple-reader-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/simple-reader.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK / NDK
        run: |
          # The runner image ships the SDK; add the NDK explicitly so the path is known.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri android init --ci
      # "Open with" / "Share to": adds intent filters, the MainActivity hooks and Incoming.kt. Fails if the template changed.
      - run: node src-tauri/android-patches/apply.mjs
      # A debug build (R8 would strip the JavaScript bridge of the "Open with" patch), made not debuggable by the patch, signed below with our own key.
      - run: npx tauri android build --apk --debug --target aarch64
      - name: The APK must declare the Open with / Share filters
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          manifest=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          for action in android.intent.action.VIEW android.intent.action.SEND android.intent.action.SEND_MULTIPLE; do
            echo "$manifest" | grep -q "$action" || { echo "missing $action in the built manifest"; exit 1; }
          done
          echo "$manifest" | grep -q 'debuggable.*=true' && { echo "the APK is debuggable"; exit 1; }
          unzip -p "$apk" 'classes*.dex' | grep -aq SRIntent || { echo "Incoming.kt is not in the dex"; exit 1; }
          unzip -p "$apk" 'classes*.dex' | grep -aq folderPicked || { echo "the folder picker is not in the dex"; exit 1; }
      # Android only updates an app when the new APK has the same signing key. The debug key changes with every CI
      # runner, so without our own key each release would need an uninstall first, which deletes the library.
      - name: Sign the APK with the release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Public SHA-256 of our certificate: a different key (or none) must fail the build, not ship quietly.
          EXPECTED_SHA256: f96fe8e98a5f7ee5c85f0cfbd8196c8d405bb85bd021b9d17fac09978470f407
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing key in this run: the APK keeps its debug signature and cannot update an installed release"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk'); do
            "$apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias simple-reader --ks-pass env:KEYSTORE_PASSWORD "$apk"
            actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)
            echo "$apk signed with $actual"
            [ "$actual" = "$EXPECTED_SHA256" ] || { echo "unexpected signing certificate"; exit 1; }
          done
          rm -f "$RUNNER_TEMP/release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: simple-reader-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Pushing a tag like v0.2.0 publishes both builds on a GitHub Release, with latest.json for the desktop updater. The APK
  # is signed with our own key (see above). It must not be a pre-release: the updater reads releases/latest/download,
  # which skips pre-releases.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          setup=$(find artifacts/simple-reader-windows -name '*-setup.exe' | head -n1)
          apk=$(find artifacts/simple-reader-android -name '*.apk' | head -n1)
          cp "$setup" "simple-reader-$tag-windows-setup.exe"
          # What the installed desktop app reads to learn there is an update, and the signature it checks the installer against.
          jq -n --arg version "${tag#v}" --arg signature "$(cat "$setup.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/simple-reader-$tag-windows-setup.exe" \
            '{version: $version, notes: "", pub_date: (now | todate), platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' > latest.json
          cp "$apk" "simple-reader-$tag-android-debug.apk"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "simple-reader $tag" --generate-notes \
            "simple-reader-$tag-windows-setup.exe" "simple-reader-$tag-android-debug.apk" latest.json
