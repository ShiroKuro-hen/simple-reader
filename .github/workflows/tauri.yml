name: Tauri (Windows + Android)

on:
  workflow_dispatch:
  push:
    branches: [tauri]
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: simple-reader-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/simple-reader.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK / NDK
        run: |
          # The runner image ships the SDK; add the NDK explicitly so the path is known.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri android init --ci
      # Debug build: signed with the auto-generated debug key, so the APK is installable as is.
      - run: npx tauri android build --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: simple-reader-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Pushing a tag like v0.2.0 publishes both builds on a GitHub Release. They are unsigned
  # (debug-signed APK, no Windows code signing), so the release is marked as a pre-release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          setup=$(find artifacts/simple-reader-windows -name '*-setup.exe' | head -n1)
          apk=$(find artifacts/simple-reader-android -name '*.apk' | head -n1)
          cp "$setup" "simple-reader-$tag-windows-setup.exe"
          cp "$apk" "simple-reader-$tag-android-debug.apk"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "simple-reader $tag" --generate-notes --prerelease \
            "simple-reader-$tag-windows-setup.exe" "simple-reader-$tag-android-debug.apk"
